<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Sales Coach · Demo</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, #eef4ff 0%, #ffffff 70%);
    color: #0f172a;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap { text-align: center; padding: 40px 24px; max-width: 640px; }
  .logo {
    width: 44px; height: 44px; margin: 0 auto 18px;
    border-radius: 12px;
    background: linear-gradient(135deg, #3143c8, #2563eb);
    color: #fff; font-weight: 800; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 10px; }
  p.sub { font-size: 14px; color: #475569; line-height: 1.6; margin: 0 0 32px; }
  .cards { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  a.card {
    display: block; width: 240px; padding: 20px 18px;
    background: #fff; border: 1px solid #e2e8f0; border-radius: 14px;
    text-decoration: none; color: inherit;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  a.card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(37, 99, 235, 0.12); }
  .card .lang { font-size: 11px; font-weight: 700; letter-spacing: .12em; color: #2563eb; text-transform: uppercase; }
  .card .title { font-size: 16px; font-weight: 700; margin: 6px 0 4px; }
  .card .desc { font-size: 12px; color: #64748b; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">AI</div>
  <h1>AI Sales Coach · Interactive Demo</h1>
  <p class="sub">Fully offline, ~3 minutes, built-in scripted session.<br>完全离线运行，约 3 分钟，内置演示剧本。</p>
  <div class="cards">
    <a class="card" href="./demo-en.html">
      <div class="lang">English</div>
      <div class="title">English Demo</div>
      <div class="desc">Role-play with Director Wang, then review the explainable scorecard &amp; team dashboard.</div>
    </a>
    <a class="card" href="./demo.html">
      <div class="lang">中文</div>
      <div class="title">中文演示</div>
      <div class="desc">与王总监对练，体验可解释评分报告与管理者看板。</div>
    </a>
  </div>
</div>
</body>
</html>
